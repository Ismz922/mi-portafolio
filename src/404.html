<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mi Portafolio</title>
  <script>
    // Redirigir a la página principal
    var path = window.location.pathname;
    var repoName = '/mi-portafolio';
    
    // Si la ruta es /en/... redirigir a /mi-portafolio/en/...
    if (path.startsWith('/en/')) {
      window.location.href = repoName + '/en/index.html';
    } else {
      window.location.href = repoName + '/index.html';
    }
  </script>
</head>
<body>
  <h1>Redirigiendo...</h1>
</body>
</html>
